<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Deep-Guard Lens</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <svg width="22" height="22" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path d="M13 2.5 3.5 6.2v6.4c0 5.6 3.9 10.2 9.5 11.4 5.6-1.2 9.5-5.8 9.5-11.4V6.2L13 2.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M9.3 12.8l2.6 2.6 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Deep-Guard Lens</h1>
  </header>
  <p class="hint">Right-click any picture on any website and choose <b>Check with Deep-Guard</b>.</p>

  <form id="serverForm">
    <label for="server">Deep-Guard server</label>
    <div class="row">
      <input id="server" type="url" placeholder="http://127.0.0.1:8000" spellcheck="false" />
      <button type="submit">Save</button>
    </div>
    <p id="status" class="status" aria-live="polite">Checking the connection…</p>
  </form>

  <button id="scanBtn" class="primary" type="button">Check the images on this page</button>
  <p id="scanOut" class="status" aria-live="polite"></p>

  <section>
    <h2>Recent checks</h2>
    <ol id="recent"><li class="none">Nothing checked yet.</li></ol>
  </section>
  <script src="popup.js"></script>
</body>
</html>
